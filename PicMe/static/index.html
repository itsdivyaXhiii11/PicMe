<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicMe · Find my graduation photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f0ec;--ink:#1b1f3b;--cobalt:#2f3bff;--gold:#f2b705;--mute:#6b6f85;--line:#d9d6cf}
@media (prefers-color-scheme:dark){:root{--paper:#14162b;--ink:#f2f0ec;--mute:#9a9db5;--line:#2a2d4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:clamp(20px,5vw,56px)}
h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:1;font-weight:800;letter-spacing:-.03em;margin:0 0 12px;max-width:12ch}
  .brand{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;margin-bottom:18px}
.brand span{background:var(--gold);color:#1b1f3b;padding:0 8px;border-radius:8px;margin-left:2px}
p.lead{color:var(--mute);max-width:46ch;margin:0 0 28px}
.stage{display:grid;gap:20px;justify-items:start}
.cam{position:relative;width:min(100%,340px);aspect-ratio:3/4;border-radius:170px 170px 24px 24px;overflow:hidden;background:#000;border:3px solid var(--ink)}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
button,.btn{font:inherit;font-weight:600;background:var(--cobalt);color:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:wait}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#msg{min-height:1.5em;color:var(--mute)}
#msg.err{color:#d6336c}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:40px 0 16px}
.bar h2{margin:0;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--line)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.zips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.zips .btn{padding:10px 18px;font-size:.92rem}
.more{display:block;margin:24px auto 0}
.expired{background:#d6336c;color:#fff;border-radius:12px;padding:14px 18px;margin:0 0 18px;font-weight:600}
.card a{position:absolute;right:8px;bottom:8px;background:var(--gold);color:#1b1f3b;font-weight:600;font-size:.85rem;padding:7px 14px;border-radius:999px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand">Pic<span>Me</span></div>
  <h1>Find your graduation photos</h1>
  <p class="lead">Look at the camera and scan your face. You'll only see photos you appear in.</p>

  <section class="stage">
    <div class="cam"><video id="v" autoplay playsinline muted></video></div>
    <button id="scan" disabled>Scan my face</button>
    <label id="up" class="btn alt" hidden>Upload a selfie instead<input id="file" type="file" accept="image/*" capture="user" hidden></label>
    <div id="msg" role="status">Starting camera…</div>
  </section>

  <section id="out" hidden>
    <div class="bar">
      <h2 id="count"></h2>
    </div>
    <div id="zips" class="zips" aria-label="Download ZIP files"></div>
    <div id="grid" class="grid"></div>
    <button id="more" class="more" hidden>Show more</button>
  </section>
</main>

<script>
const v = document.getElementById('v'), scan = document.getElementById('scan'),
      msg = document.getElementById('msg'), out = document.getElementById('out');
const say = (t, err) => { msg.textContent = t; msg.className = err ? 'err' : ''; };

fetch('/api/status').then(r => r.json()).then(s => {
  if (s.allow_upload) document.getElementById('up').hidden = false;
  if (!s.photos) say('No photos are indexed yet. Run ingest.py, then restart the server.', true);
});

if (!navigator.mediaDevices) say('Camera needs https:// or http://localhost. Open the app from localhost or a secure link.', true);
else navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960}}})
  .then(s => { v.srcObject = s; scan.disabled = false; if (!msg.classList.contains('err')) say(''); })
  .catch(() => say('Camera blocked. Allow camera access in your browser settings and reload.', true));

scan.onclick = async () => {
  scan.disabled = true; say('Looking for your photos…'); out.hidden = true;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
  await send(blob);
};

document.getElementById('file').onchange = async e => {
  if (e.target.files[0]) { say('Looking for your photos…'); out.hidden = true; await send(e.target.files[0]); }
};

async function send(blob) {
  const fd = new FormData(); fd.append('file', blob, 'selfie.jpg');
  try {
    const r = await fetch('/api/match', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Something went wrong');
    show(d);
  } catch (e) { say(e.message, true); }
  scan.disabled = !v.srcObject;
}

const PAGE = 48;                       // photos drawn at a time
let TOKEN = '', PHOTOS = [], shown = 0;
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// A dead session: say so clearly and send the student back to the scan.
function expired(text) {
  TOKEN = ''; PHOTOS = []; shown = 0;
  out.hidden = true;
  document.getElementById('grid').innerHTML = '';
  say(text || 'Your session has expired. Please scan your face again.', true);
  scan.disabled = !v.srcObject;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Ask the server if the session is still alive (also tells us the ZIP parts).
async function zipInfo() {
  const r = await fetch('/api/zip/info?t=' + encodeURIComponent(TOKEN));
  if (r.status === 401) { expired(); return null; }
  if (!r.ok) throw new Error('Could not reach the server. Try again.');
  return r.json();
}

function addCards() {
  const g = document.getElementById('grid');
  const end = Math.min(shown + PAGE, PHOTOS.length);
  for (; shown < end; shown++) {
    const p = PHOTOS[shown];
    const d = document.createElement('div'); d.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async';
    img.alt = 'Photo ' + p.name;                     // set as a property: no HTML parsing
    img.src = '/api/thumb/' + encodeURIComponent(p.id) + '?t=' + encodeURIComponent(TOKEN);
    img.onerror = () => { img.onerror = null; zipInfo().catch(() => {}); };   // expired? tell the student
    const a = document.createElement('a');
    a.textContent = 'Download';
    a.href = '/api/photo/' + encodeURIComponent(p.id) + '?t=' + encodeURIComponent(TOKEN);
    a.setAttribute('download', p.name);
    a.onclick = async e => {                         // check session first so an expired link is not a dead download
      e.preventDefault();
      try { if (await zipInfo()) location.href = a.href; } catch (err) { say(err.message, true); }
    };
    d.append(img, a); g.appendChild(d);
  }
  const more = document.getElementById('more');
  more.hidden = shown >= PHOTOS.length;
  more.textContent = `Show more (${PHOTOS.length - shown} left)`;
}
document.getElementById('more').onclick = addCards;

function drawZips(info) {
  const z = document.getElementById('zips'); z.innerHTML = '';
  for (const p of info.parts) {
    const b = document.createElement('a'); b.className = 'btn';
    b.textContent = info.total_parts === 1 ? `Download all (${p.first}–${p.last})`
                                           : `Part ${p.part} (${p.first}–${p.last})`;
    b.href = '/api/zip?t=' + encodeURIComponent(TOKEN) + '&part=' + p.part;
    b.onclick = async e => {
      e.preventDefault();
      try { if (await zipInfo()) location.href = b.href; } catch (err) { say(err.message, true); }
    };
    z.appendChild(b);
  }
}

async function show({token, photos}) {
  if (!photos.length) { say("No photos found yet. Try again facing the light, or check back later.", true); return; }
  say('');
  TOKEN = token; PHOTOS = photos; shown = 0;
  document.getElementById('count').textContent = photos.length + (photos.length === 1 ? ' photo' : ' photos') + ' of you';
  document.getElementById('grid').innerHTML = '';
  document.getElementById('zips').innerHTML = '';
  addCards();                                         // only the first 48 are created
  out.hidden = false; out.scrollIntoView({behavior:'smooth'});
  try { const info = await zipInfo(); if (info) drawZips(info); }
  catch (e) { say(e.message, true); }
}

// Coming back to a tab that sat open for a long time? Re-check the session.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && TOKEN) zipInfo().catch(() => {});
});
</script>
</body>
</html>
